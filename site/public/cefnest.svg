<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>CEFNest</title>
  <desc>Chromium-style three segments carrying the GTK cube</desc>

  <!-- Chromium-style three segments, full radius -->
  <path d="M512 512 L512 12 A500 500 0 0 1 945.0127 762 Z" fill="#4E9BE2"/>
  <path d="M512 512 L945.0127 762 A500 500 0 0 1 78.9873 762 Z" fill="#2E73C9"/>
  <path d="M512 512 L78.9873 762 A500 500 0 0 1 512 12 Z" fill="#1C57A8"/>

  <!-- white seams between the segments, same width as the cube edges -->
  <polygon points="500,16 524,16 524,512 500,512" fill="#fff"/>
  <polygon points="506,522.39 518,501.61 951.01,751.61 939.01,772.39" fill="#fff"/>
  <polygon points="518,522.39 506,501.61 72.99,751.61 84.99,772.39" fill="#fff"/>

  <!-- the GTK cube -->
  <g stroke="#fff" stroke-width="24" stroke-linejoin="round" stroke-linecap="round">
    <!-- top -->
    <path d="M512 252 L737.16 382 L512 512 L286.84 382 Z" fill="#8FC1EC"/>
    <!-- left -->
    <path d="M286.84 382 L512 512 L512 772 L286.84 642 Z" fill="#E8402F"/>
    <!-- right -->
    <path d="M512 512 L737.16 382 L737.16 642 L512 772 Z" fill="#74D428"/>
    <!-- silhouette -->
    <path d="M512 252 L737.16 382 L737.16 642 L512 772 L286.84 642 L286.84 382 Z" fill="none"/>
  </g>
</svg>
