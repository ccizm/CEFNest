<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CEFNest：用真正的 Chromium 渲染网页的 GTK 4 控件。原生 Wayland，无 XWayland，无离屏渲染。"
    />
    <meta name="theme-color" content="#fafafb" />
    <script>
      (function () {
        var dark
        try {
          var saved = localStorage.getItem('cefnest-theme')
          dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        } catch (e) {
          dark = matchMedia('(prefers-color-scheme: dark)').matches
        }
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.bsTheme = dark ? 'dark' : 'light'
      })()
    </script>
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="./cefnest.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>CEFNest — 在 GTK 4 里嵌入真正的 Chromium</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
