# CNB (cnb.cool) entry point.
#
# Builds happen on release only: a tag push checks the release strings, compiles
# the library, the demo, the examples and the test clients on a hosted Ubuntu
# 24.04 runner, fetches the verified stable CEF (154.0.34), builds
# cefnest-helper against it, installs and smoke-tests the deb packages, then
# creates the Release for that tag and uploads the build tarball plus the
# installable deb/rpm packages (including the helper and its CEF runtime) as
# Release assets. Push a version tag such as v154.0.34-7 to publish one.
# Ordinary branch pushes build nothing here — the full gate (test/ci-all.sh)
# runs locally or on a prepared self-hosted runner; docs/testing/cnb-ci.md
# describes both paths.
#
# The CEFNEST_PACKAGE_RELEASE / CEFNEST_EXPECTED_TAG pair and the asset names
# below are static (the attachment list cannot expand shell variables), so they
# carry the version they pin: when the CEF package version or the revision
# changes, all three move together, and scripts/check-release-tag.sh — the first
# stage — fails in seconds if one of them was forgotten. That check exists
# because the alternative was finding out 90 minutes later, on the upload.
$:
  tag_push:
    - name: release
      stages:
        - name: check the release strings
          image: ubuntu:24.04
          script: CEFNEST_PACKAGE_RELEASE=7 CEFNEST_EXPECTED_TAG=v154.0.34-7 ./scripts/check-release-tag.sh
          timeout: 10m
        - name: build
          image: ubuntu:24.04
          script: CEFNEST_PACKAGE_RELEASE=7 ./scripts/ci-build.sh
          timeout: 90m
        - name: install and smoke the packages
          image: ubuntu:24.04
          # The runner is root on some pools and a sudo user on others; the
          # script only installs its own packages when it really is root, so
          # escalate first and let it fail loudly if neither works.
          # gcc and binutils are here for the script's own two checks — a host
          # compiling against the installed cefnest.pc, and reading the helper
          # path out of the build-tree library. The bare image has neither, and
          # without them those two lines degrade to "did not run" notes. A failed
          # apt for these stops the stage: a smoke job that cannot say what it
          # did not check is worse than a red line.
          script: CEFNEST_PACKAGE_RELEASE=7 sh -c 'as_root() { if [ "$(id -u)" = 0 ]; then "$@"; else sudo -E "$@"; fi; }; as_root apt-get update -qq; as_root apt-get install -y --no-install-recommends gcc binutils; as_root ./scripts/ci-smoke-packages.sh'
          timeout: 30m
        - name: create release
          type: git:release
          options:
            title: CEFNest
            descriptionFromFile: RELEASE-NOTES.md
            latest: true
        - name: upload release assets
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./dist/cefnest-build.tar.gz"
              - "./dist/cefnest_154.0.34-7_amd64.deb"
              - "./dist/cefnest-dev_154.0.34-7_amd64.deb"
              - "./dist/cefnest-154.0.34-7.x86_64.rpm"
              - "./dist/cefnest-devel-154.0.34-7.x86_64.rpm"
              - "./dist/SHA256SUMS"
