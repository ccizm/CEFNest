# CNB (cnb.cool) entry point for a build-only run.
#
# This pipeline compiles the library, the demo, the examples and the test
# clients on a hosted Ubuntu 24.04 runner, then uploads one tarball as a commit
# attachment. It deliberately does not run test/ci-all.sh: the full gate needs
# GTK/Wayland/DRM, gnome-shell --headless and a 1.5 GB CEF distribution, which
# a hosted runner does not have. That gate stays local or on a prepared
# self-hosted runner; docs/testing/cnb-ci.md describes both paths.
main:
  push:
    - name: build-artifacts
      stages:
        - name: build
          image: ubuntu:24.04
          script: |
            set -eu
            export DEBIAN_FRONTEND=noninteractive
            SUDO=""
            if [ "$(id -u)" != 0 ]; then SUDO=sudo; fi
            $SUDO apt-get update
            $SUDO apt-get install -y --no-install-recommends \
              build-essential meson ninja-build pkg-config git linux-libc-dev \
              libgtk-4-dev libwayland-dev libxkbcommon-dev libjson-glib-dev \
              libgbm-dev libdrm-dev wayland-protocols
            rm -rf builddir
            meson setup builddir
            ninja -C builddir
            mkdir -p artifact
            cp -a builddir/src/libcefnest.so \
              builddir/src/libcefnest.so.0 \
              builddir/src/libcefnest.so.0.0.1 artifact/
            cp -a builddir/src/cefnest-demo artifact/
            cp -a builddir/examples/cefnest-host artifact/ 2>/dev/null || true
            cp -a builddir/examples/cefnest-minimal artifact/ 2>/dev/null || true
            cp -a builddir/test/shm-client artifact/
            cp -a builddir/test/seat-selftest artifact/
            tar -czf cefnest-build.tar.gz -C artifact .
          timeout: 30m
        - name: upload build
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./cefnest-build.tar.gz"
