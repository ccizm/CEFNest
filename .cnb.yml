# CNB (cnb.cool) entry point.
#
# Builds happen on release only: a tag push checks the release strings, compiles
# the library, the demo, the examples and the test clients on a hosted Ubuntu
# 24.04 runner, fetches the verified stable CEF (154.0.34), builds
# cefnest-helper against it, installs and smoke-tests the deb packages, then
# creates the Release for that tag and uploads the build tarball plus the
# installable deb/rpm packages (including the helper and its CEF runtime) as
# Release assets. Push a version tag such as v154.0.34-1 to publish one.
# Ordinary branch pushes build nothing here — the full gate (test/ci-all.sh)
# runs locally or on a prepared self-hosted runner — except the site, which
# deploys to EdgeOne Pages on every push to main (see the main: block at the
# bottom).
#
# The CEFNEST_PACKAGE_RELEASE / CEFNEST_EXPECTED_TAG pair and the asset names
# below are static (the attachment list cannot expand shell variables), so they
# carry the version they pin: when the CEF package version or the revision
# changes, all three move together, and scripts/check-release-tag.sh — the first
# stage — fails in seconds if one of them was forgotten. That check exists
# because the alternative was finding out 90 minutes later, on the upload.
$:
  tag_push:
    - name: release
      stages:
        - name: check the release strings
          image: ubuntu:24.04
          script: CEFNEST_PACKAGE_RELEASE=1 CEFNEST_EXPECTED_TAG=v154.0.34-1 ./scripts/check-release-tag.sh
          timeout: 10m
        - name: build
          image: ubuntu:24.04
          script: CEFNEST_PACKAGE_RELEASE=1 ./scripts/ci-build.sh
          timeout: 90m
        - name: install and smoke the packages
          image: ubuntu:24.04
          # The runner is root on some pools and a sudo user on others; every
          # script here decides for itself whether it needs sudo, so the command
          # stays one line. scripts/ci-smoke-job.sh is that line's content:
          # tzdata first — the -8 run's single failure had tzdata at the head of
          # its `dpkg: error processing package … (--configure)` chain, caused
          # by a postinst renaming over the runner's bind-mounted
          # /etc/localtime — then gcc and binutils
          # for the smoke script's own two checks, then the smoke script.
          script: CEFNEST_PACKAGE_RELEASE=1 ./scripts/ci-smoke-job.sh
          timeout: 30m
        - name: create release
          type: git:release
          options:
            title: CEFNest
            descriptionFromFile: RELEASE-NOTES.md
            latest: true
        - name: upload release assets
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./dist/cefnest-build.tar.gz"
              - "./dist/cefnest_154.0.34-1_amd64.deb"
              - "./dist/cefnest-dev_154.0.34-1_amd64.deb"
              - "./dist/cefnest-154.0.34-1.x86_64.rpm"
              - "./dist/cefnest-devel-154.0.34-1.x86_64.rpm"
              - "./dist/SHA256SUMS"

# The documentation site (site/) deploys to Tencent EdgeOne Pages on every
# push to main. EO_SECRET is not stored in this repository: the deploy stage
# imports it from the private EO repository (a one-line file,
# `EO_SECRET: "<token>"`), the same config-repo pattern as hotel/mmt-web, so
# only that stage ever sees the value. The EdgeOne Pages project name is
# fixed: cefnest.
main:
  push:
    site_deploy:
      name: site deploy
      runner:
        cpus: 2
      docker:
        image: node:22
      stages:
        - name: build the site
          script:
            - cd site && npm ci --no-audit --no-fund && npm run build
        - name: deploy to EdgeOne Pages
          imports:
            - https://cnb.cool/yanzhiming/EO/-/blob/main/eo.yml
          image: tencentcom/deploy-eopages:latest
          script:
            - test -n "$EO_SECRET" || { echo "EO_SECRET was not imported"; exit 1; }
            - cd site && edgeone pages deploy dist -n cefnest -t "$EO_SECRET"
          retry: 1
          allowFailure: false
