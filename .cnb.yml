# CNB (cnb.cool) entry point.
#
# The branch pipeline compiles the library, the demo, the examples and the test
# clients on a hosted Ubuntu 24.04 runner, fetches the verified stable CEF
# (154.0.34), builds cefnest-helper against it, and uploads the build tarball plus
# installable deb/rpm packages (including the helper and its CEF runtime) as
# commit attachments.
#
# A tag push runs the same build and then creates the Release for that tag and
# uploads the same files as Release assets. Push a version tag such as
# v154.0.34 to publish one.
#
# Neither pipeline runs test/ci-all.sh: the full gate needs
# gnome-shell --headless and a prepared display/D-Bus session, which a hosted
# runner does not have. That gate stays local or on a prepared self-hosted
# runner; docs/testing/cnb-ci.md describes both paths.
main:
  push:
    - name: build-artifacts
      stages:
        - name: build
          image: ubuntu:24.04
          script: ./scripts/ci-build.sh
          timeout: 90m
        - name: upload build
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./cefnest-build.tar.gz"
              - "./dist/libcefnest0.deb"
              - "./dist/libcefnest-dev.deb"
              - "./dist/cefnest-demo.deb"
              - "./dist/cefnest-helper.deb"
              - "./dist/cefnest.rpm"
              - "./dist/cefnest-devel.rpm"
              - "./dist/cefnest-demo.rpm"
              - "./dist/cefnest-helper.rpm"
              - "./dist/cefnest-packages.tar.gz"
              - "./dist/SHA256SUMS"
$:
  tag_push:
    - name: release
      stages:
        - name: build
          image: ubuntu:24.04
          script: ./scripts/ci-build.sh
          timeout: 90m
        - name: create release
          type: git:release
          options:
            title: CEFNest
            descriptionFromFile: RELEASE-NOTES.md
            latest: true
        - name: upload release assets
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./cefnest-build.tar.gz"
              - "./dist/libcefnest0.deb"
              - "./dist/libcefnest-dev.deb"
              - "./dist/cefnest-demo.deb"
              - "./dist/cefnest-helper.deb"
              - "./dist/cefnest.rpm"
              - "./dist/cefnest-devel.rpm"
              - "./dist/cefnest-demo.rpm"
              - "./dist/cefnest-helper.rpm"
              - "./dist/cefnest-packages.tar.gz"
              - "./dist/SHA256SUMS"
