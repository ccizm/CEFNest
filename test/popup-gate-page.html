<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Popup gate page</title>
<style>
  /* One link, absolutely positioned, so a scripted pointer press knows
     exactly where it lands. target=_blank asks for a new tab; a middle
     click on the same link asks for a background one. */
  #link {
    position: absolute;
    left: 150px;
    top: 120px;
    width: 300px;
    height: 60px;
    font-size: 28px;
    padding: 20px;
    background: #eee;
  }
</style>
</head>
<body>
<a id="link" href="popup-target.html" target="_blank">open in new tab</a>
</body>
</html>
